# Configuration for train_hybrid.py: train on a mix of real and synthetic spot crops.
#
# Usage:
#   python train_hybrid.py configs/hybrid.yaml
#
# The real-data, filter, params, dataset, model, loss and training sections are
# those of configs/real.yaml; the gaussian section is that of
# configs/synthetic.yaml. Relative paths are resolved from the directory the
# script is run in.

seed: 0

# ----------------------------------------------------------------------------
# Mix
# ----------------------------------------------------------------------------
hybrid:
  synthetic_fraction: 0.5  # share of the training and validation sets that is synthetic.
                           # Real crops are requested at dataset.*_size and filtered first;
                           # the synthetic count is derived from the surviving real count so
                           # the share is exact (the total is a little below dataset.*_size).

# ----------------------------------------------------------------------------
# Real RHEED spot crops: <growth>/<spot> datasets of shape (N, y, x)
# ----------------------------------------------------------------------------
data:
  path: ../data/RHEED_4848_test6.h5   # RHEED_data_file
  spots: [spot_1, spot_2, spot_3]     # SPOTS
  training_growths: 7    # TRAINING_GROWTHS
  validation_growths: 2  # VALIDATION_GROWTHS
  test_growths: 1        # TEST_GROWTHS
  images_per_growth: 10000  # IMAGES_PER_GROWTH (crops sampled without replacement per growth and spot)

image:
  x: 48                  # GAUSSIAN_X (crop width, pixels; real crops and synthetic images)
  y: 48                  # GAUSSIAN_Y (crop height, pixels)

# Real crops are background-subtracted (per-crop minimum) and divided by 256; crops
# whose resulting peak is below min_peak are dropped ("bad crops").
filter:
  min_peak: 0.1          # is_valid_image: img.max() < min_peak -> invalid

# ----------------------------------------------------------------------------
# Synthetic crops (one rotated 2D Gaussian per crop, no noise or background)
# ----------------------------------------------------------------------------
gaussian:
  min_offset_x: -4       # MIN_OFFSET_X: center = x/2 + uniform(min_offset_x, max_offset_x)
  max_offset_x: 4        # MAX_OFFSET_X
  min_offset_y: -4       # MIN_OFFSET_Y
  max_offset_y: 4        # MAX_OFFSET_Y
  min_std_x: 5           # MIN_STD_X
  max_std_x: 11          # MAX_STD_X
  min_std_y: 5           # MIN_STD_Y
  max_std_y: 11          # MAX_STD_Y
  min_theta: 0           # MIN_THETA (radians; a string such as "pi" or "pi/2" is accepted)
  max_theta: pi          # MAX_THETA
  min_intensity: 0.2     # MIN_INTENSITY
  max_intensity: 0.8     # MAX_INTENSITY

# Model outputs are normalized parameters; multiplying by `scaling` recovers
# physical units (real.yaml values; Rheed-Eval reads them from the saved
# config.yaml). Ordering:
#   [center_x, center_y, std_x, std_y, sin(2*theta), cos(2*theta), intensity]
params:
  scaling: [48.0, 48.0, 10.0, 10.0, 1.0, 1.0, 1.0]   # scaling_arr

# ----------------------------------------------------------------------------
# Datasets (real crops requested before the bad-crop filter; see hybrid above)
# ----------------------------------------------------------------------------
dataset:
  training_size: 100000  # TRAINING_DATASET_SIZE (real crops drawn with replacement)
  validation_size: 10000 # VALIDATION_DATASET_SIZE
  test_size: 10000       # TEST_DATASET_SIZE, per source: real (before filter) and synthetic
  batch_size: 128        # BATCH_SIZE

# ----------------------------------------------------------------------------
# QKeras model
# ----------------------------------------------------------------------------
model:
  name: gaussian
  total_bits: 8          # TOTAL_BITS
  integer_bits: 0        # INTEGER_BITS
  # One block per entry: QConv2D(3x3, valid) -> BatchNorm -> quantized ReLU -> MaxPool
  conv_filters: [6, 8, 8]
  pool_sizes: [2, 2, 3]
  dense_units: 28        # Dense(relu) before the split parameter heads

# ----------------------------------------------------------------------------
# Loss: weighted reconstruction MSE, weight = target pixel + bg_weight
# ----------------------------------------------------------------------------
loss:
  bg_weight: 0.13        # BG_WEIGHT (real.yaml)

# ----------------------------------------------------------------------------
# Training
# ----------------------------------------------------------------------------
training:
  train: true            # TRAIN_MODEL
  load_from: null        # LOAD_MODEL: path to a saved model to load before training/testing
  epochs: 100            # NUM_EPOCHS
  learning_rate: 1.0e-3
  global_clipnorm: 1.0
  early_stopping:
    patience: 10         # EARLY_STOPPING_PATIENCE
    min_delta: 1.0e-4    # MIN_DELTA
  reduce_lr:
    factor: 0.5
    patience: 5
    min_lr: 1.0e-5

# ----------------------------------------------------------------------------
# Outputs
# ----------------------------------------------------------------------------
output:
  save_model: true       # SAVE_MODEL
  models_dir: Models
  model_name: hybrid_flow_model   # MODEL_NAME -> saved to <models_dir>/<model_name>
  num_plot_examples: 4   # test examples per source to render as PNGs under plots/{real,synthetic}
